<svg xmlns="http://www.w3.org/2000/svg" width="1234" height="748" viewBox="0 0 1234 748" role="img" aria-label="设置面板线框"><title>设置面板线框</title><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#222}rect{fill:#fafafa;stroke:#999}</style><rect width="1234" height="748" style="fill:#eee;stroke:none"/><rect x="24" y="24" width="760" height="700" rx="5"/><text x="40" y="54" font-size="22">桌面：右侧设置抽屉</text><text x="40" y="85" font-size="16">左侧保留仪表盘上下文</text><rect x="380" y="88" width="380" height="600" rx="5"/><text x="396" y="118" font-size="22">策略设置</text><text x="396" y="149" font-size="16">当前订阅：演示订阅 A</text><text x="396" y="175" font-size="16">监测：开启</text><text x="396" y="201" font-size="16">检测间隔（秒） [ 60 ]</text><text x="396" y="227" font-size="16">请求超时（秒） [ 待配置 ]</text><text x="396" y="253" font-size="16">入口失败阈值（次） [ 3 ]</text><text x="396" y="279" font-size="16">冷却时间（秒） [ 300 ]</text><text x="396" y="305" font-size="16">自动切换：关闭</text><text x="396" y="331" font-size="16">未锁定时禁用：先诊断并确认锁定</text><rect x="400" y="580" width="130" height="34" rx="3"/><text x="410" y="603" font-size="13">取消</text><rect x="548" y="580" width="180" height="34" rx="3"/><text x="558" y="603" font-size="13">保存设置</text><text x="400" y="650" font-size="13">启用自动切换时显示独立确认框</text><rect x="820" y="24" width="390" height="700" rx="5"/><text x="836" y="54" font-size="22">窄屏：全屏设置 · 关闭 ×</text><text x="836" y="85" font-size="16">当前订阅：演示订阅 A</text><text x="836" y="111" font-size="16">监测：开启</text><text x="836" y="137" font-size="16">检测间隔（秒） [ 60 ]</text><text x="836" y="163" font-size="16">请求超时（秒） [ 待配置 ]</text><text x="836" y="189" font-size="16">入口失败阈值（次） [ 3 ]</text><text x="836" y="215" font-size="16">冷却时间（秒） [ 300 ]</text><text x="836" y="241" font-size="16">自动切换：关闭</text><text x="836" y="267" font-size="16">未锁定时禁用：先诊断并确认锁定</text><rect x="840" y="620" width="130" height="34" rx="3"/><text x="850" y="643" font-size="13">取消</text><rect x="988" y="620" width="180" height="34" rx="3"/><text x="998" y="643" font-size="13">保存设置</text></svg>

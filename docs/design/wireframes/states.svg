<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="1560" viewBox="0 0 1424 1560" role="img" aria-label="状态线框"><title>状态线框</title><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#222}rect{fill:#fafafa;stroke:#999}</style><rect width="1424" height="1560" style="fill:#eee;stroke:none"/><text x="24" y="36" font-size="24">静态状态稿 · 每块为对应区域的替代线框</text><rect x="24" y="64" width="676" height="132" rx="5"/><text x="40" y="94" font-size="22">首次未锁定</text><text x="40" y="125" font-size="16">入口：未锁定；站点监测照常运行</text><text x="40" y="151" font-size="16">诊断可用；自动切换禁用，提示先确认锁定</text><rect x="724" y="64" width="676" height="132" rx="5"/><text x="740" y="94" font-size="22">无报告</text><text x="740" y="125" font-size="16">尚无候选数据</text><text x="740" y="151" font-size="16">显示重新诊断；应用不可用</text><rect x="24" y="212" width="676" height="132" rx="5"/><text x="40" y="242" font-size="22">不支持锁定</text><text x="40" y="273" font-size="16">多个真实入口域名（示例原因）</text><text x="40" y="299" font-size="16">应用和自动切换不可用；独立站点监测保留</text><rect x="724" y="212" width="676" height="132" rx="5"/><text x="740" y="242" font-size="22">正常</text><text x="740" y="273" font-size="16">入口正常；各站点独立显示结果</text><text x="740" y="299" font-size="16">合格且有效的候选允许应用</text><rect x="24" y="360" width="676" height="132" rx="5"/><text x="40" y="390" font-size="22">加载</text><text x="40" y="421" font-size="16">正在读取已有结果…</text><text x="40" y="447" font-size="16">刷新加载中；避免重复请求</text><rect x="724" y="360" width="676" height="132" rx="5"/><text x="740" y="390" font-size="22">未知</text><text x="740" y="421" font-size="16">OpenAI 官方状态暂无法解析</text><text x="740" y="447" font-size="16">显示未知；不推断服务或入口故障</text><rect x="24" y="508" width="676" height="132" rx="5"/><text x="40" y="538" font-size="22">数据过期</text><text x="40" y="569" font-size="16">上次成功：10:20:00 · 已过期</text><text x="40" y="595" font-size="16">保留旧值作参考；不得展示为当前健康</text><rect x="724" y="508" width="676" height="132" rx="5"/><text x="740" y="538" font-size="22">国内网络异常</text><text x="740" y="569" font-size="16">互联网不可达 / 不确定</text><text x="740" y="595" font-size="16">暂停入口判断和自动切换；保留站点实际结果</text><rect x="24" y="656" width="676" height="132" rx="5"/><text x="40" y="686" font-size="22">单站失败</text><text x="40" y="717" font-size="16">GitHub 超时 · HTTP — · 延时 —</text><text x="40" y="743" font-size="16">Google / OpenAI 独立显示；不增加入口失败</text><rect x="724" y="656" width="676" height="132" rx="5"/><text x="740" y="686" font-size="22">入口连续故障</text><text x="740" y="717" font-size="16">入口异常 · 连续失败 3 / 3</text><text x="740" y="743" font-size="16">满足自动处理条件时诊断；展示执行阶段</text><rect x="24" y="804" width="676" height="132" rx="5"/><text x="40" y="834" font-size="22">无合格候选</text><text x="40" y="865" font-size="16">严格诊断完成 · 无备选</text><text x="40" y="891" font-size="16">保持原配置；冷却剩余 04:59，继续监测</text><rect x="724" y="804" width="676" height="132" rx="5"/><text x="740" y="834" font-size="22">Clash 未启动</text><text x="740" y="865" font-size="16">Clash 不可用 · 入口未知</text><text x="740" y="891" font-size="16">代理探测显示连接失败；写操作禁用</text><rect x="24" y="952" width="676" height="132" rx="5"/><text x="40" y="982" font-size="22">后台不可达</text><text x="40" y="1013" font-size="16">连接后台失败 · 数据为上次快照</text><text x="40" y="1039" font-size="16">持续提示；写操作禁用，可重试刷新</text><rect x="724" y="952" width="676" height="132" rx="5"/><text x="740" y="982" font-size="22">任务执行中</text><text x="740" y="1013" font-size="16">正在重载配置 · 开始于 10:21:00</text><text x="740" y="1039" font-size="16">冲突操作禁用；保留任务 ID，不虚构百分比</text><rect x="24" y="1100" width="676" height="132" rx="5"/><text x="40" y="1130" font-size="22">操作成功</text><text x="40" y="1161" font-size="16">应用成功 · 已通过独立验证</text><text x="40" y="1187" font-size="16">更新锁定信息，事件显示完成时间</text><rect x="724" y="1100" width="676" height="132" rx="5"/><text x="740" y="1130" font-size="22">失败已恢复</text><text x="740" y="1161" font-size="16">应用失败 · 已恢复并重新加载</text><text x="740" y="1187" font-size="16">显示失败原因和恢复结果，可查看详情</text><rect x="24" y="1248" width="676" height="132" rx="5"/><text x="40" y="1278" font-size="22">恢复失败</text><text x="40" y="1309" font-size="16">需人工处理：恢复后的重载失败</text><text x="40" y="1335" font-size="16">持续提示并停止自动修改；不显示回滚成功</text><rect x="724" y="1248" width="676" height="132" rx="5"/><text x="740" y="1278" font-size="22">订阅变化</text><text x="740" y="1309" font-size="16">当前为演示订阅 B · 原报告失效</text><text x="740" y="1335" font-size="16">计数清零并重读锁定；自动切换需重新启用</text><rect x="24" y="1396" width="676" height="132" rx="5"/><text x="40" y="1426" font-size="22">报告过期</text><text x="40" y="1457" font-size="16">报告已过期 · 原有效至 10:50:00</text><text x="40" y="1483" font-size="16">应用禁用；提示重新诊断</text><rect x="724" y="1396" width="676" height="132" rx="5"/><text x="740" y="1426" font-size="22">回滚不匹配</text><text x="740" y="1457" font-size="16">相关配置已在外部修改</text><text x="740" y="1483" font-size="16">回滚禁用；提示无法安全恢复旧快照</text></svg>

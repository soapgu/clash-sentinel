<svg xmlns="http://www.w3.org/2000/svg" width="1224" height="704" viewBox="0 0 1224 704" role="img" aria-label="操作确认线框"><title>操作确认线框</title><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#222}rect{fill:#fafafa;stroke:#999}</style><rect width="1224" height="704" style="fill:#eee;stroke:none"/><rect x="24" y="24" width="576" height="314" rx="5"/><text x="40" y="54" font-size="22">应用此 IP</text><text x="40" y="85" font-size="16">当前订阅：演示订阅 A</text><text x="40" y="111" font-size="16">入口：entry.example.com</text><text x="40" y="137" font-size="16">192.0.2.10 → 192.0.2.20</text><text x="40" y="163" font-size="16">将备份、应用并重载，连接可能短暂中断。</text><text x="40" y="189" font-size="16">验证失败将尝试恢复原配置。</text><rect x="264" y="278" width="100" height="34" rx="3"/><text x="274" y="301" font-size="13">取消</text><rect x="380" y="278" width="194" height="34" rx="3"/><text x="390" y="301" font-size="13">应用此 IP</text><rect x="624" y="24" width="576" height="314" rx="5"/><text x="640" y="54" font-size="22">解除锁定</text><text x="640" y="85" font-size="16">当前订阅：演示订阅 A</text><text x="640" y="111" font-size="16">192.0.2.10 → entry.example.com</text><text x="640" y="137" font-size="16">解除锁定并关闭当前订阅自动切换。</text><text x="640" y="163" font-size="16">网站监测继续运行。</text><text x="640" y="189" font-size="16">连接可能短暂中断。</text><rect x="864" y="278" width="100" height="34" rx="3"/><text x="874" y="301" font-size="13">取消</text><rect x="980" y="278" width="194" height="34" rx="3"/><text x="990" y="301" font-size="13">解除当前锁定</text><rect x="24" y="364" width="576" height="314" rx="5"/><text x="40" y="394" font-size="22">回滚最近变更</text><text x="40" y="425" font-size="16">当前订阅：演示订阅 A</text><text x="40" y="451" font-size="16">最近变更：10:15 应用 192.0.2.20</text><text x="40" y="477" font-size="16">将恢复至 192.0.2.10 并重新加载。</text><text x="40" y="503" font-size="16">仅上下文匹配时允许执行。</text><text x="40" y="529" font-size="16">外部修改或订阅变化后将拒绝回滚。</text><rect x="264" y="618" width="100" height="34" rx="3"/><text x="274" y="641" font-size="13">取消</text><rect x="380" y="618" width="194" height="34" rx="3"/><text x="390" y="641" font-size="13">回滚最近变更</text><rect x="624" y="364" width="576" height="314" rx="5"/><text x="640" y="394" font-size="22">启用自动切换</text><text x="640" y="425" font-size="16">当前订阅：演示订阅 A · 已锁定</text><text x="640" y="451" font-size="16">互联网正常且入口连续失败 3 次时诊断。</text><text x="640" y="477" font-size="16">有合格备选时可自动修改入口 IP。</text><text x="640" y="503" font-size="16">每次自动处理后默认冷却 5 分钟。</text><text x="640" y="529" font-size="16">网站卡片结果不参与自动切换判定。</text><rect x="864" y="618" width="100" height="34" rx="3"/><text x="874" y="641" font-size="13">取消</text><rect x="980" y="618" width="194" height="34" rx="3"/><text x="990" y="641" font-size="13">启用自动切换</text></svg>
